name: Railway staging

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA with successful CI
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: railway-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: railway-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Require successful exact-revision CI and isolated staging
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          ISOLATION: ${{ vars.STAGING_ISOLATION_VERIFIED }}
        run: |
          test "$ISOLATION" = synthetic-sandbox-only
          test "$(git rev-parse HEAD)" = "$REVISION"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&status=success" --jq '.workflow_runs | any(.conclusion == "success")' | grep -qx true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global @railway/cli@5.71.0
      - name: Upload to isolated staging only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CALLER: skill:use-railway@1.3.5
          RAILWAY_AGENT_SESSION: personal-finance-staging-ci
        run: railway up --project 2c2ceec6-dacc-4c72-9f2a-fc1f980d57ec --environment 55011e12-2ebb-4637-bf00-fe7a95f4fef1 --service web --ci
