name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Detect conflicting/duplicate migration files (e.g. two branches generated the same index).
      - run: pnpm db:check
      # Detect schema drift: schema.ts changed without a generated migration. `db:generate` is
      # offline (no DATABASE_URL); any new file under drizzle/ means a migration is missing.
      - run: pnpm db:generate
      - run: |
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed but no migration committed. Run 'pnpm db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

  react-doctor:
    # Absolute quality gate: the full scan must score 100/100. Design-tagged rules
    # are excluded from both the score and the CI-failure surface, so `--blocking
    # warning` fails the build on any scored finding — i.e. exactly when the score
    # would drop below 100. Rule scope/exclusions live in doctor.config.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned (not @latest) so a future react-doctor release can't add rules and
      # spuriously fail the gate; bump deliberately alongside the `doctor` script.
      - run: pnpm dlx react-doctor@0.5.8 --yes --scope full --blocking warning --no-telemetry
