name: Railway production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  prepare-cli:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    # Package installation has no deployment credentials or protected environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Prepare pinned Railway CLI without deployment authority
        run: |
          npm install --prefix "$RUNNER_TEMP/railway-cli" --no-audit --no-fund @railway/cli@5.71.0
          "$RUNNER_TEMP/railway-cli/node_modules/.bin/railway" --version
          tar -czf "$RUNNER_TEMP/railway-cli.tgz" -C "$RUNNER_TEMP" railway-cli
      - uses: actions/upload-artifact@v4
        with:
          name: railway-cli
          path: ${{ runner.temp }}/railway-cli.tgz
          retention-days: 1

  deploy:
    needs: prepare-cli
    environment: railway-production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAILWAY_CLI: ${{ runner.temp }}/railway-cli/node_modules/.bin/railway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require successful exact-revision CI
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$REVISION"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&status=success" --jq '.workflow_runs | any(.conclusion == "success")' | grep -qx true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: railway-cli
          path: ${{ runner.temp }}
      - name: Unpack CLI from this workflow run
        run: tar -xzf "$RUNNER_TEMP/railway-cli.tgz" -C "$RUNNER_TEMP"
      - name: Apply reviewed migrations once through the release service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CALLER: skill:use-railway@1.3.5
          RAILWAY_AGENT_SESSION: personal-finance-production-ci
        run: node scripts/hosting/deploy-service.mjs migrations
      - name: Verify main has not moved during migration
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$REVISION"
      - name: Deploy validated main revision
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CALLER: skill:use-railway@1.3.5
          RAILWAY_AGENT_SESSION: personal-finance-production-ci
        run: node scripts/hosting/deploy-service.mjs web
      - name: Record release evidence
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf 'Released main commit: `%s`\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Application: https://web-production-a5531.up.railway.app\n' >> "$GITHUB_STEP_SUMMARY"
